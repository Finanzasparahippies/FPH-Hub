name: fph-hub

services:
  backend:
    build:
      context: ./finanzasparahippies-backend
      dockerfile: Dockerfile
    container_name: fph_backend
    restart: always
    env_file:
      - ./finanzasparahippies-backend/.env
    environment:
      - PYTHONPATH=/app
      - DEBUG=True
      - REDIS_URL=redis://nectar_redis:6379/1
    volumes:
      - ./finanzasparahippies-backend:/app:z
    expose:
      - 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    networks:
      - prod_network

  fph_frontend:
    build:
      context: ./finanzasparahippies-front
      dockerfile: Dockerfile
    container_name: fph_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://fph_backend:8000/api
      - WATCHPACK_POLLING=true
      - NODE_ENV=production
    ports:
      - "3003:3000"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
    networks:
      - prod_network

networks:
  prod_network:
    external: true
    name: prod_network

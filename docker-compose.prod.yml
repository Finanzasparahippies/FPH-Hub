name: fph-hub-prod

services:
  fph_backend_prod:
    build:
      context: ./finanzasparahippies-backend
      dockerfile: Dockerfile
    container_name: fph_backend_prod
    restart: always
    env_file:
      - ./finanzasparahippies-backend/.env
    environment:
      - PYTHONPATH=/app
      - DEBUG=False
      - REDIS_URL=redis://nectar_redis:6379/1
    volumes:
      - ./finanzasparahippies-backend/static:/app/static:z
      - ./finanzasparahippies-backend/media:/app/media:z
    expose:
      - 8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60
    networks:
      - prod_network

  fph_frontend_prod:
    build:
      context: ./finanzasparahippies-front
      dockerfile: Dockerfile
    container_name: fph_frontend_prod
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://fph_backend_prod:8000/api
      - NODE_ENV=production
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - fph_backend_prod
    networks:
      - prod_network

networks:
  prod_network:
    external: true
    name: prod_network

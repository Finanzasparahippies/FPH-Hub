upstream fph_frontend {
    server fph_frontend:3000;
}

upstream fph_backend {
    server backend:8000;
}

upstream nectar_frontend {
    server nectar-labs-frontend-1:3000;
}

upstream nectar_backend {
    server nectar-labs-backend-1:8000;
}

# --- REDIRECT HTTP TO HTTPS ---
server {
    listen 80;
    server_name finanzasparahippies.com www.finanzasparahippies.com nectarlabs.dev www.nectarlabs.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- FINANZAS PARA HIPPIES (HTTPS) ---
server {
    listen 443 ssl;
    server_name finanzasparahippies.com www.finanzasparahippies.com;

    ssl_certificate /etc/letsencrypt/live/finanzasparahippies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzasparahippies.com/privkey.pem;

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    location ~ ^/(api|admin) {
        proxy_pass http://fph_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fph_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}

# --- NECTAR LABS (HTTPS) ---
server {
    listen 443 ssl;
    server_name nectarlabs.dev www.nectarlabs.dev;

    ssl_certificate /etc/nectar-ssl/live/nectarlabs.dev/fullchain.pem;
    ssl_certificate_key /etc/nectar-ssl/live/nectarlabs.dev/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location ~ ^/(api|admin) {
        proxy_pass http://nectar_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://nectar_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}